<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Video Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl text-center">
    <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500 mb-2">
      AI Video Creator 🚀
    </h1>
    <p class="text-slate-400 text-sm mb-6">Prompt daalo, AI script generate karega!</p>

    <textarea id="promptInput" rows="3" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:ring-2 focus:ring-purple-500 mb-4" placeholder="e.g., Space exploration video clip..."></textarea>

    <button onclick="generateVideo()" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:opacity-90 font-bold py-3 rounded-xl transition">
      Generate ✨
    </button>

    <div id="resultBox" class="mt-6 hidden text-left bg-slate-950 p-4 border border-slate-800 rounded-xl">
      <h3 class="text-purple-400 font-bold text-sm mb-1">Generated Output:</h3>
      <p id="resultText" class="text-slate-300 text-xs font-mono whitespace-pre-wrap"></p>
    </div>
  </div>

  <script>
    async function generateVideo() {
      const prompt = document.getElementById('promptInput').value;
      if (!prompt) return alert('Pehle text prompt toh likho!');

      const resultBox = document.getElementById('resultBox');
      const resultText = document.getElementById('resultText');

      resultBox.classList.remove('hidden');
      resultText.innerText = 'AI Engine processing... ⏳';

      try {
        const response = await fetch(`https://ai-video-generator-aian.onrender.com/generate-script?prompt=${encodeURIComponent(prompt)}`);
        const data = await response.json();
        resultText.innerText = JSON.stringify(data, null, 2);
      } catch (error) {
        resultText.innerText = 'Error connecting to AI Backend!';
      }
    }
  </script>
</body>
</html>
