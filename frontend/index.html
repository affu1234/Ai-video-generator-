<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LuminaAI - Luxury Visual Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-[#030712] text-slate-100 min-h-screen flex flex-col justify-between items-center p-3 sm:p-6 selection:bg-indigo-500 selection:text-white relative overflow-x-hidden">

  <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[300px] bg-indigo-600/10 blur-[120px] rounded-full pointer-events-none"></div>

  <header class="w-full max-w-xl flex items-center justify-between pb-4 border-b border-slate-800/60 relative z-10">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30 ring-1 ring-white/20">
        <i class="fa-solid fa-crown text-base text-amber-300 drop-shadow"></i>
      </div>
      <div>
        <span class="font-black text-xl text-white tracking-tight flex items-center gap-1">
          Lumina<span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-pink-400">AI</span>
        </span>
        <span class="block text-[9px] font-bold text-slate-400 -mt-0.5 tracking-widest uppercase">Elite Studio v5.3</span>
      </div>
    </div>
    
    <div class="flex items-center gap-2">
      <div class="flex items-center gap-1.5 text-[10px] font-black bg-gradient-to-r from-amber-500/10 to-yellow-500/10 text-amber-300 border border-amber-500/30 px-3 py-2 rounded-full uppercase tracking-wider shadow-sm">
        <i class="fa-solid fa-gem text-[9px]"></i> VIP Active
      </div>
    </div>
  </header>

  <main class="w-full max-w-xl bg-slate-900/60 border border-slate-800/80 rounded-3xl p-5 sm:p-7 shadow-2xl backdrop-blur-2xl my-auto mt-4 relative z-10 ring-1 ring-white/5">
    
    <div class="text-center mb-6">
      <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 text-[10px] font-bold uppercase tracking-wider mb-2.5">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Direct AI Prompt Engine
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-200 to-slate-400">
        Create Elite Visuals Instantly
      </h1>
      <p class="text-slate-400 text-xs mt-1.5 font-medium">Type any name, character or scene to generate exact image</p>
    </div>

    <div class="mb-5 bg-slate-950/70 p-3.5 rounded-2xl border border-slate-800/80 shadow-inner">
      <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5 flex items-center gap-1.5">
        <i class="fa-solid fa-sliders text-indigo-400"></i> Select Dimension Ratio
      </label>
      <select id="aspectRatio" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 font-semibold cursor-pointer">
        <option value="16:9">🖼️ 16:9 Landscape (Desktop / Cinematic)</option>
        <option value="9:16">📱 9:16 Portrait (Instagram Reels / Shorts)</option>
        <option value="1:1">⬛ 1:1 Square (Instagram Post)</option>
      </select>
    </div>

    <div class="space-y-3.5 mb-5">
      <div class="relative">
        <textarea id="promptInput" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-4 pr-32 text-xs text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/60 transition resize-none placeholder-slate-500 font-normal shadow-inner leading-relaxed" placeholder="Type prompt (e.g. Salman Khan, futuristic sports car, cyberpunk city)..."></textarea>
        
        <button onclick="enhancePromptLocally()" class="absolute right-3 top-3 bg-gradient-to-r from-indigo-600/40 to-purple-600/40 hover:from-indigo-600/60 hover:to-purple-600/60 border border-indigo-500/50 text-indigo-200 text-[10px] font-bold px-3 py-2 rounded-xl transition flex items-center gap-1.5 shadow-md">
          <i class="fa-solid fa-wand-magic-sparkles text-amber-300 text-xs"></i> AI Enhance
        </button>
      </div>

      <button id="genBtn" onclick="generateVisual()" class="w-full bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:opacity-95 font-extrabold py-4 rounded-2xl transition shadow-xl shadow-indigo-950/50 text-xs sm:text-sm flex items-center justify-center gap-2.5 uppercase tracking-wider ring-1 ring-white/20 active:scale-[0.99]">
        <i class="fa-solid fa-bolt-lightning text-amber-300 text-sm"></i> Generate Premium Image
      </button>
    </div>

    <div id="loadingState" class="hidden py-10 text-center bg-slate-950/80 rounded-2xl border border-slate-800/80 mb-4 shadow-inner">
      <div class="inline-block w-9 h-9 border-4 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin mb-3"></div>
      <p class="text-xs text-indigo-300 font-bold tracking-wide animate-pulse">Painting your exact image from prompt... ⏳</p>
    </div>

    <div id="resultBox" class="hidden space-y-4">
      <div id="visualFrame" class="relative w-full rounded-2xl overflow-hidden border border-indigo-500/30 shadow-2xl bg-black group ring-1 ring-white/10">
        <img id="videoVisual" class="w-full h-auto object-cover block transition duration-500 group-hover:scale-105" alt="AI Generated Elite Image" />
        <div class="absolute top-3 right-3 bg-black/60 backdrop-blur-md px-3 py-1 rounded-full border border-white/10 flex items-center gap-1.5 text-[10px] text-indigo-300 font-semibold shadow-lg">
          <i class="fa-solid fa-shield-check text-emerald-400"></i> AI Verified HD
        </div>
      </div>
    </div>

  </main>

  <footer class="mt-6 text-center text-xs text-slate-500 pb-2 relative z-10 flex items-center justify-center gap-1.5">
    <span>Crafted with</span>
    <i class="fa-solid fa-heart text-pink-500 text-[10px]"></i>
    <span>by</span>
    <a href="https://www.instagram.com/digitalaffan.1?igsh=MWwzNWZoamYxdGVkdw==" target="_blank" class="text-indigo-400 hover:text-pink-400 font-bold underline transition">
      @digitalaffan.1
    </a>
  </footer>

  <script>
    function enhancePromptLocally() {
      const promptInput = document.getElementById('promptInput');
      const val = promptInput.value.trim();
      if (!val) return alert('Pehle prompt box me kuch likhiye!');
      
      promptInput.value = `Cinematic portrait masterpiece of ${val}, hyperdetailed 8k resolution, dramatic studio lighting, photorealistic`;
    }

    function generateVisual() {
      const promptInput = document.getElementById('promptInput');
      const prompt = promptInput.value.trim();
      const aspectRatio = document.getElementById('aspectRatio').value;

      if (!prompt) {
        return alert('Pehle text prompt likhna zaroori hai!');
      }

      const loadingState = document.getElementById('loadingState');
      const resultBox = document.getElementById('resultBox');
      const videoVisual = document.getElementById('videoVisual');

      loadingState.classList.remove('hidden');
      resultBox.classList.add('hidden');

      // Dimensions mapping
      let w = 1280, h = 720;
      if (aspectRatio === "9:16") { w = 720; h = 1280; }
      else if (aspectRatio === "1:1") { w = 800; h = 800; }

      // Direct Image URL Generation matching user prompt 100%
      const encodedPrompt = encodeURIComponent(prompt);
      const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=${w}&height=${h}&nologo=true&seed=${Math.floor(Math.random()*1000)}`;

      // Simulate loading delay for smooth loader animation
      setTimeout(() => {
        videoVisual.src = imageUrl;
        loadingState.classList.add('hidden');
        resultBox.classList.remove('hidden');
      }, 800);
    }
  </script>
</body>
</html>
