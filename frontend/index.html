<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Video Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-between p-4 font-sans">

  <div></div>

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl text-center my-auto">
    <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500 mb-2">
      AI Video Creator 🚀
    </h1>
    <p class="text-slate-400 text-sm mb-6">Prompt daalo, AI script generate karega!</p>

    <textarea id="promptInput" rows="3" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:ring-2 focus:ring-purple-500 mb-4 placeholder-slate-500" placeholder="e.g., Space exploration video clip..."></textarea>

    <button onclick="generateVideo()" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:opacity-90 font-bold py-3 rounded-xl transition shadow-lg shadow-purple-900/30">
      Generate ✨
    </button>

    <div id="resultBox" class="mt-6 hidden text-left bg-slate-950 p-4 border border-slate-800 rounded-xl">
      <h3 class="text-purple-400 font-bold text-sm mb-1 flex items-center gap-2">
        <span>Generated Output:</span>
      </h3>
      <p id="resultText" class="text-slate-300 text-xs font-mono whitespace-pre-wrap leading-relaxed mt-2"></p>
    </div>
  </div>

  <footer class="mt-8 text-center text-xs text-slate-500 pb-4 flex items-center justify-center gap-1.5">
    <span>Developed by</span>
    <a href="https://www.instagram.com/digitalaffan.1?igsh=MWwzNWZoamYxdGVkdw==" target="_blank" rel="noopener noreferrer" class="text-purple-400 hover:text-pink-400 font-semibold inline-flex items-center gap-1.5 bg-slate-900 px-3 py-1.5 rounded-full border border-slate-800 transition-all hover:border-purple-500/50">
      <svg class="w-3.5 h-3.5 fill-current text-pink-500" viewBox="0 0 24 24">
        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
      </svg>
      @digitalaffan.1
    </a>
  </footer>

  <script>
    async function generateVideo() {
      const prompt = document.getElementById('promptInput').value;
      if (!prompt) return alert('Pehle text prompt toh likho!');

      const resultBox = document.getElementById('resultBox');
      const resultText = document.getElementById('resultText');

      resultBox.classList.remove('hidden');
      resultText.innerText = 'AI Engine processing... ⏳';

      try {
        const response = await fetch(`https://ai-video-generator-aian.onrender.com/generate-script?prompt=${encodeURIComponent(prompt)}`);
        const data = await response.json();
        
        if (data.script) {
          resultText.innerText = data.script;
        } else {
          resultText.innerText = JSON.stringify(data, null, 2);
        }
      } catch (error) {
        resultText.innerText = 'Error connecting to AI Backend!';
      }
    }
  </script>
</body>
</html>
