<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Video Creator & Studio Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-between p-4 font-sans selection:bg-purple-500 selection:text-white">

  <header class="w-full max-w-md py-4 flex items-center justify-between border-b border-slate-800/80 mb-4">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center font-bold text-sm shadow-lg shadow-purple-900/50">
        AI
      </div>
      <span class="font-bold text-slate-200 tracking-wide">Studio<span class="text-purple-400">.ai</span></span>
    </div>
    <span class="text-[10px] font-semibold bg-purple-500/10 text-purple-400 border border-purple-500/20 px-2.5 py-1 rounded-full uppercase tracking-wider">
      v3.0 Pro
    </span>
  </header>

  <div class="max-w-md w-full bg-slate-900/90 border border-slate-800 rounded-3xl p-6 shadow-2xl backdrop-blur-xl my-auto">
    
    <div class="text-center mb-5">
      <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-400 to-amber-300">
        AI Video Creator 🚀
      </h1>
      <p class="text-slate-400 text-xs mt-1">Prompt daalo, options chunno aur instant media generate karo!</p>
    </div>

    <div class="mb-4">
      <p class="text-[11px] font-semibold text-slate-500 mb-2 uppercase tracking-wider">Quick Suggestions:</p>
      <div class="flex flex-wrap gap-1.5">
        <button onclick="setPrompt('Space exploration with glowing nebula and futuristic spaceship')" class="text-xs bg-slate-800/80 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-700/50 transition">🚀 Space</button>
        <button onclick="setPrompt('Cyberpunk city streets rainy night with neon lights')" class="text-xs bg-slate-800/80 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-700/50 transition">🏙️ Cyberpunk</button>
        <button onclick="setPrompt('Deep forest with magical glowing creatures and waterfall')" class="text-xs bg-slate-800/80 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-700/50 transition">🌲 Fantasy</button>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-2 mb-4">
      <div>
        <label class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">Video Ratio</label>
        <select id="aspectRatio" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl p-2 text-xs text-slate-300 focus:outline-none focus:ring-1 focus:ring-purple-500">
          <option value="16:9">16:9 (YouTube Video)</option>
          <option value="9:16">9:16 (Reels / Shorts)</option>
          <option value="1:1">1:1 (Square Post)</option>
        </select>
      </div>
      <div>
        <label class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">Voice Accent</label>
        <select id="voiceAccent" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl p-2 text-xs text-slate-300 focus:outline-none focus:ring-1 focus:ring-purple-500">
          <option value="en-US">English (US Accent)</option>
          <option value="en-UK">English (UK Accent)</option>
          <option value="hi-IN">Hindi Accent</option>
        </select>
      </div>
    </div>

    <textarea id="promptInput" rows="3" class="w-full bg-slate-950/80 border border-slate-800 rounded-2xl p-3.5 text-xs text-white focus:outline-none focus:ring-2 focus:ring-purple-500/80 focus:border-transparent mb-4 placeholder-slate-600 transition resize-none" placeholder="Apna video prompt yahan likhein..."></textarea>

    <button id="genBtn" onclick="generateVideo()" class="w-full bg-gradient-to-r from-purple-600 via-pink-600 to-amber-500 hover:opacity-95 font-bold py-3.5 rounded-2xl transition shadow-xl shadow-purple-900/30 text-sm flex items-center justify-center gap-2">
      <span>Generate Scene & Audio</span> ✨
    </button>

    <div id="resultBox" class="mt-6 hidden text-left bg-slate-950/90 p-4 border border-slate-800 rounded-2xl transition-all">
      
      <div id="loadingState" class="py-8 text-center hidden">
        <div class="inline-block w-8 h-8 border-4 border-purple-500/30 border-t-purple-500 rounded-full animate-spin mb-3"></div>
        <p class="text-xs text-slate-400 font-medium animate-pulse">AI Visuals, Script & Custom Audio generate ho raha hai... ⏳</p>
      </div>

      <div id="contentArea">
        <div id="imageContainer" class="mb-4 hidden">
          <div class="flex items-center justify-between mb-2">
            <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">AI Visual Frame</span>
            <button onclick="downloadImage()" class="text-[10px] bg-purple-500/20 text-purple-300 border border-purple-500/30 px-2 py-0.5 rounded-md hover:bg-purple-500/40 transition">
              Download Image 📥
            </button>
          </div>
          <img id="generatedImg" class="w-full h-auto rounded-xl border border-slate-800 shadow-md mb-3 transition duration-300" alt="AI Scene" />
        </div>

        <div id="voiceContainer" class="mb-3 hidden bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
          <span class="text-[11px] font-semibold text-purple-400 block mb-1.5">🎙️ Custom Voiceover Audio</span>
          <audio id="voicePlayer" controls class="w-full h-8 rounded-lg"></audio>
        </div>

        <div id="bgMusicContainer" class="mb-4 hidden bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
          <span class="text-[11px] font-semibold text-pink-400 block mb-1.5">🎵 Ambient Sound Track</span>
          <audio id="bgMusicPlayer" controls loop class="w-full h-8 rounded-lg"></audio>
        </div>

        <div class="mt-3">
          <div class="flex items-center justify-between mb-1">
            <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Script Content</span>
            <button onclick="copyScript()" class="text-[10px] text-purple-400 hover:text-purple-300 font-semibold bg-purple-500/10 px-2 py-1 rounded-md border border-purple-500/20 transition">Copy Script 📋</button>
          </div>
          <p id="resultText" class="text-slate-300 text-xs font-mono whitespace-pre-wrap leading-relaxed bg-slate-900/50 p-3 rounded-xl border border-slate-800/80 mt-1"></p>
        </div>
      </div>

    </div>
  </div>

  <footer class="mt-8 text-center text-xs text-slate-500 pb-4 flex items-center justify-center gap-1.5">
    <span>Developed by</span>
    <a href="https://www.instagram.com/digitalaffan.1?igsh=MWwzNWZoamYxdGVkdw==" target="_blank" rel="noopener noreferrer" class="text-purple-400 hover:text-pink-400 font-semibold inline-flex items-center gap-1.5 bg-slate-900/80 px-3 py-1.5 rounded-full border border-slate-800 transition-all hover:border-purple-500/50">
      <svg class="w-3.5 h-3.5 fill-current text-pink-500" viewBox="0 0 24 24">
        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
      </svg>
      @digitalaffan.1
    </a>
  </footer>

  <script>
    function setPrompt(text) {
      document.getElementById('promptInput').value = text;
    }

    function copyScript() {
      const text = document.getElementById('resultText').innerText;
      if (text) {
        navigator.clipboard.writeText(text);
        alert('Script copied to clipboard! 📋');
      }
    }

    function downloadImage() {
      const imgUrl = document.getElementById('generatedImg').src;
      if (imgUrl) {
        window.open(imgUrl, '_blank');
      }
    }

    async function generateVideo() {
      const prompt = document.getElementById('promptInput').value;
      if (!prompt) return alert('Pehle text prompt toh likho!');

      const aspectRatio = document.getElementById('aspectRatio').value;
      const voiceAccent = document.getElementById('voiceAccent').value;

      const resultBox = document.getElementById('resultBox');
      const loadingState = document.getElementById('loadingState');
      const contentArea = document.getElementById('contentArea');
      
      const resultText = document.getElementById('resultText');
      const imageContainer = document.getElementById('imageContainer');
      const generatedImg = document.getElementById('generatedImg');
      
      const voiceContainer = document.getElementById('voiceContainer');
      const voicePlayer = document.getElementById('voicePlayer');
      const bgMusicContainer = document.getElementById('bgMusicContainer');
      const bgMusicPlayer = document.getElementById('bgMusicPlayer');

      resultBox.classList.remove('hidden');
      loadingState.classList.remove('hidden');
      contentArea.classList.add('hidden');

      try {
        const response = await fetch(`https://ai-video-generator-aian.onrender.com/generate-script?prompt=${encodeURIComponent(prompt)}`);
        const data = await response.json();
        
        loadingState.classList.add('hidden');
        contentArea.classList.remove('hidden');

        if (data.image_url) {
          let imgUrl = data.image_url;
          if (aspectRatio === "9:16") {
            imgUrl = imgUrl.replace("width=1024&height=576", "width=576&height=1024");
          } else if (aspectRatio === "1:1") {
            imgUrl = imgUrl.replace("width=1024&height=576", "width=800&height=800");
          }
          generatedImg.src = imgUrl;
          imageContainer.classList.remove('hidden');
        }

        if (data.voice_url) {
          let voiceUrl = data.voice_url.replace("tl=en", `tl=${voiceAccent.split('-')[0]}`);
          voicePlayer.src = voiceUrl;
          voiceContainer.classList.remove('hidden');
        }

        if (data.bg_music_url) {
          bgMusicPlayer.src = data.bg_music_url;
          bgMusicContainer.classList.remove('hidden');
        }

        resultText.innerText = data.script || JSON.stringify(data, null, 2);
      } catch (error) {
        loadingState.classList.add('hidden');
        contentArea.classList.remove('hidden');
        resultText.innerText = 'Error connecting to AI Backend!';
      }
    }
  </script>
</body>
</html>
